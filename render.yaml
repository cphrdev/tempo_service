services:
  - type: web
    name: tempo-preflight-api
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: TEMPO_RPC_URL
        value: https://rpc.tempo.xyz
      - key: PAYMENT_DESTINATION
        sync: false
      - key: MPP_SECRET_KEY
        generateValue: true

