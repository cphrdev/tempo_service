[project]
name = "tempo-lottery-api"
version = "1.0.0"
description = "MPP-paid weekly lottery for Tempo wallets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.7,<3",
    "pympp[server,tempo]>=0.4,<1",
    "pytempo>=0.5,<1",
    "uvicorn[standard]>=0.34,<1",
    "web3>=7.13,<8",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
