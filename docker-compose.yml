services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8000"
    expose:
      - "8000"
    volumes:
      - type: bind
        source: ./data
        target: /app/data
      - type: bind
        source: ./logs
        target: /app/logs

  scheduler:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.scheduler"]
    env_file: .env
    volumes:
      - type: bind
        source: ./data
        target: /app/data
      - type: bind
        source: ./logs
        target: /app/logs
    depends_on:
      - app

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - type: bind
        source: ./nginx/nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./nginx/conf.d
        target: /etc/nginx/conf.d
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./nginx/certs
        target: /etc/nginx/certs
        read_only: true
        bind:
          create_host_path: false
      - certbot-webroot:/var/www/certbot

  # Run on demand only (docker compose run --rm certbot ...), never on `up`.
  # scripts/issue-letsencrypt-cert.sh and renew-letsencrypt-cert.sh drive it.
  certbot:
    image: certbot/certbot:latest
    profiles:
      - certs
    volumes:
      - certbot-webroot:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
      # Writable: certbot copies issued certs to where nginx reads them.
      - type: bind
        source: ./nginx/certs
        target: /etc/nginx/certs
        bind:
          create_host_path: false

volumes:
  certbot-webroot:
  certbot-conf:
