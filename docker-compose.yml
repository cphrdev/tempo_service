services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8000"
    expose:
      - "8000"
    # No host port mapping: the app is only reachable through nginx.

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Long syntax with create_host_path disabled: if a source is missing,
      # compose fails with a clear error instead of silently creating an empty
      # directory that then cannot be mounted onto a file.
      - type: bind
        source: ./nginx/nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./nginx/conf.d
        target: /etc/nginx/conf.d
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./nginx/certs
        target: /etc/nginx/certs
        read_only: true
        bind:
          create_host_path: false
      - certbot-webroot:/var/www/certbot

volumes:
  certbot-webroot:
